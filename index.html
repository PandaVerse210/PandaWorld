
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PandaWorld 🐼</title>

<style>
:root {
  --green: #527b59;
  --dark-green: #304c36;
  --light-green: #e4efdf;
  --cream: #faf8ef;
  --white: #ffffff;
  --text: #26372b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  background: var(--green);
  color: white;
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  margin-right: 8px;
}

#authArea {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(140deg,#e7f0df,#faf8ef);
}

.auth-card {
  width: 100%;
  max-width: 410px;
  background: white;
  padding: 35px;
  border-radius: 22px;
  box-shadow: 0 8px 30px #26372b18;
  text-align: center;
}

.panda {
  font-size: 78px;
  margin-bottom: 10px;
}

.auth-card h1 {
  color: var(--green);
  margin-bottom: 10px;
}

.auth-card p {
  color: #777;
  line-height: 1.5;
  margin-bottom: 20px;
}

.auth-card input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #d9dfd5;
  border-radius: 10px;
}

.main-button {
  width: 100%;
  background: var(--green);
  color: white;
  border: none;
  padding: 13px;
  border-radius: 10px;
  margin-top: 12px;
  font-weight: bold;
}

.main-button:hover {
  background: var(--dark-green);
}

.main-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.switch {
  color: var(--green);
  margin-top: 20px;
  cursor: pointer;
  font-size: 14px;
}

#authMessage {
  color: #b33b3b;
  font-size: 13px;
  margin-top: 12px;
}

#app {
  display: none;
}

nav {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: white;
  overflow-x: auto;
  border-bottom: 1px solid #e5e8df;
}

nav button {
  border: none;
  padding: 11px 15px;
  background: #f0f4ec;
  color: var(--text);
  border-radius: 10px;
  white-space: nowrap;
}

nav button.active {
  background: var(--green);
  color: white;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px;
  min-height: 70vh;
}

.welcome {
  background: var(--light-green);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 25px;
}

.welcome h1 {
  color: var(--dark-green);
  margin-bottom: 12px;
  font-size: 28px;
}

.welcome p {
  line-height: 1.7;
  color: #536655;
}

.welcome-emoji {
  font-size: 65px;
  margin-bottom: 10px;
}

.page-title {
  color: var(--green);
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
  gap: 16px;
  margin-top: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 3px 12px #26372b0c;
}

.card h3 {
  margin-bottom: 9px;
}

.card p {
  color: #777;
  font-size: 14px;
  line-height: 1.6;
}

.emoji {
  font-size: 35px;
  margin-bottom: 12px;
}

.empty {
  background: white;
  padding: 35px 20px;
  border-radius: 16px;
  text-align: center;
  color: #777;
  line-height: 1.7;
}

.logout {
  background: #ffffff25;
  color: white;
  border: 1px solid #ffffff66;
  padding: 9px 14px;
  border-radius: 9px;
}

footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  padding: 25px;
}

input, textarea, select {
  outline-color: var(--green);
}

@media(max-width:500px) {
  header {
    padding: 14px;
  }

  .logo {
    font-size: 20px;
  }

  .auth-card {
    padding: 25px 20px;
  }

  .welcome {
    padding: 22px;
  }

  .welcome h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<section id="authArea">
  <div class="auth-card">
    <div class="panda">🐼</div>

    <h1>PandaWorld</h1>

    <p id="authDescription">
      Entre no seu universo de leitura e criatividade!
    </p>

    <form id="authForm">
      <input
        id="email"
        type="email"
        placeholder="Seu e-mail"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Sua senha"
        minlength="8"
        autocomplete="current-password"
        required
      >

      <button class="main-button" id="authButton">
        Entrar
      </button>
    </form>

    <div class="switch" id="switchAuth">
      Ainda não tem conta? Criar conta
    </div>

    <div id="authMessage"></div>
  </div>
</section>

<div id="app">

  <header>
    <div class="logo">
      <span>🐼</span>PandaWorld
    </div>

    <button class="logout" id="logoutButton">
      Sair
    </button>
  </header>

  <nav id="navigation">
    <button class="active" data-page="home">🏠 Início</button>
    <button data-page="library">📚 Biblioteca</button>
    <button data-page="create">✍️ Criar livro</button>
    <button data-page="shop">🛍️ Loja</button>
    <button data-page="games">🎮 Jogos</button>
    <button data-page="ranking">🏆 Ranking</button>
    <button data-page="news">📰 Notícias</button>
    <button data-page="profile">👤 Perfil</button>
  </nav>

  <main id="content"></main>

  <footer>
    🐼 PandaWorld — Um mundo criado por estudantes.
  </footer>

</div>

<script>

// =================================
// CONFIGURAÇÕES
// =================================

const ACCOUNTS_KEY = "pandaverse_accounts_v1";
const SESSION_KEY = "pandaverse_session_v1";

let registerMode = false;
let currentUser = null;

// =================================
// ELEMENTOS
// =================================

const authArea = document.getElementById("authArea");
const app = document.getElementById("app");
const authForm = document.getElementById("authForm");
const authButton = document.getElementById("authButton");
const authDescription = document.getElementById("authDescription");
const authMessage = document.getElementById("authMessage");
const switchAuth = document.getElementById("switchAuth");
const passwordInput = document.getElementById("password");

// =================================
// CONTAS
// =================================

function getAccounts() {
  try {
    return JSON.parse(
      localStorage.getItem(ACCOUNTS_KEY) || "{}"
    );
  } catch {
    return {};
  }
}

function saveAccounts(accounts) {
  localStorage.setItem(
    ACCOUNTS_KEY,
    JSON.stringify(accounts)
  );
}

// =================================
// SENHAS
// =================================

function createSalt() {
  return crypto.getRandomValues(new Uint8Array(16));
}

function toBase64(bytes) {
  return btoa(
    Array.from(bytes)
      .map(byte => String.fromCharCode(byte))
      .join("")
  );
}

function fromBase64(value) {
  return Uint8Array.from(
    atob(value),
    char => char.charCodeAt(0)
  );
}

async function hashPassword(password, salt) {
  const encoder = new TextEncoder();

  const key = await crypto.subtle.importKey(
    "raw",
    encoder.encode(password),
    "PBKDF2",
    false,
    ["deriveBits"]
  );

  const result = await crypto.subtle.deriveBits(
    {
      name: "PBKDF2",
      salt: salt,
      iterations: 120000,
      hash: "SHA-256"
    },
    key,
    256
  );

  return toBase64(new Uint8Array(result));
}

// =================================
// LOGIN E CADASTRO
// =================================

switchAuth.addEventListener("click", () => {
  registerMode = !registerMode;

  authButton.textContent = registerMode
    ? "Criar minha conta"
    : "Entrar";

  authDescription.textContent = registerMode
    ? "Faça seu cadastro no PandaWorld!"
    : "Entre no seu universo de leitura e criatividade!";

  switchAuth.textContent = registerMode
    ? "Já tenho uma conta. Entrar"
    : "Ainda não tem conta? Criar conta";

  passwordInput.autocomplete = registerMode
    ? "new-password"
    : "current-password";

  authMessage.textContent = "";
});

authForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  authMessage.textContent = "";

  if (!crypto.subtle) {
    authMessage.textContent =
      "Seu navegador não oferece suporte à proteção necessária.";
    return;
  }

  const email = document.getElementById("email")
    .value.trim().toLowerCase();

  const password = passwordInput.value;

  authButton.disabled = true;
  authButton.textContent = "Aguarde...";

  try {
    const accounts = getAccounts();

    if (registerMode) {
      if (accounts[email]) {
        throw new Error("Este e-mail já possui uma conta.");
      }

      if (password.length < 8) {
        throw new Error("A senha precisa ter pelo menos 8 caracteres.");
      }

      const salt = createSalt();

      const passwordHash = await hashPassword(
        password,
        salt
      );

      accounts[email] = {
        email: email,
        salt: toBase64(salt),
        passwordHash: passwordHash,
        coins: 0
      };

      saveAccounts(accounts);

    } else {
      const account = accounts[email];

      if (!account) {
        throw new Error("Conta não encontrada.");
      }

      const passwordHash = await hashPassword(
        password,
        fromBase64(account.salt)
      );

      if (passwordHash !== account.passwordHash) {
        throw new Error("Senha incorreta.");
      }
    }

    sessionStorage.setItem(SESSION_KEY, email);

    passwordInput.value = "";

    openApp(email);

  } catch (error) {
    authMessage.textContent = error.message;

  } finally {
    authButton.disabled = false;

    authButton.textContent = registerMode
      ? "Criar minha conta"
      : "Entrar";
  }
});

// =================================
// ABRIR SITE
// =================================

function openApp(email) {
  const accounts = getAccounts();

  if (!accounts[email]) return;

  currentUser = accounts[email];

  authArea.style.display = "none";
  app.style.display = "block";

  showPage("home");
}

// =================================
// SAIR
// =================================

document.getElementById("logoutButton")
  .addEventListener("click", () => {

    sessionStorage.removeItem(SESSION_KEY);

    currentUser = null;

    app.style.display = "none";
    authArea.style.display = "flex";
  });

// =================================
// NAVEGAÇÃO
// =================================

document.querySelectorAll("[data-page]")
  .forEach(button => {

    button.addEventListener("click", () => {

      document.querySelectorAll("[data-page]")
        .forEach(item => item.classList.remove("active"));

      button.classList.add("active");

      showPage(button.dataset.page);
    });
  });

// =================================
// PÁGINAS
// =================================

function showPage(page) {

  const content = document.getElementById("content");

  const pages = {

    home: `
      <section class="welcome">
        <div class="welcome-emoji">🐼🎋</div>
        <h1>Bem-vindo ao PandaWorld!</h1>
        <p>
          Um lugar onde estudantes podem criar histórias,
          descobrir livros, compartilhar jogos e fazer
          parte de uma comunidade cheia de criatividade.
        </p>
      </section>

      <h2>Explore nosso universo!</h2>

      <section class="cards">
        <article class="card">
          <div class="emoji">📚</div>
          <h3>Biblioteca</h3>
          <p>Leia histórias escritas pelos próprios estudantes.</p>
        </article>

        <article class="card">
          <div class="emoji">✍️</div>
          <h3>Escrita</h3>
          <p>Crie seu próprio livro e compartilhe sua imaginação.</p>
        </article>

        <article class="card">
          <div class="emoji">🛍️</div>
          <h3>Loja Panda</h3>
          <p>Personalize seu avatar com itens especiais.</p>
        </article>

        <article class="card">
          <div class="emoji">🎮</div>
          <h3>Jogos</h3>
          <p>Compartilhe jogos interessantes com a comunidade.</p>
        </article>

        <article class="card">
          <div class="emoji">🏆</div>
          <h3>Ranking</h3>
          <p>Veja as conquistas dos participantes.</p>
        </article>

        <article class="card">
          <div class="emoji">📰</div>
          <h3>Notícias</h3>
          <p>Acompanhe as novidades da escola e da comunidade.</p>
        </article>
      </section>
    `,

    library: `
      <h1 class="page-title">📚 Biblioteca Panda</h1>
      <div class="empty">
        Carregando biblioteca...
      </div>
    `,

    create: `
      <h1 class="page-title">✍️ Criar meu livro</h1>
      <div class="empty">
        <h2>Preparando seu editor...</h2>
      </div>
    `,

shop: `
  <h1 class="page-title">🛍️ Loja Panda</h1>
  <div class="empty">Preparando sua loja...</div>
`,

    games: `
      <h1 class="page-title">🎮 Jogos</h1>
      <div class="empty">
        <div class="emoji">🎮</div>
        <h2>Jogos da comunidade</h2>
        <p>Em breve os estudantes poderão compartilhar seus jogos.</p>
      </div>
    `,

    ranking: `
      <h1 class="page-title">🏆 Ranking</h1>
      <div class="empty">
        <div class="emoji">🏆</div>
        <h2>Ranking em construção</h2>
        <p>As conquistas dos estudantes aparecerão aqui.</p>
      </div>
    `,

    news: `
      <h1 class="page-title">📰 Notícias</h1>
      <div class="empty">
        <div class="emoji">📰</div>
        <h2>Notícias da comunidade</h2>
        <p>As notícias serão publicadas pela administração.</p>
      </div>
    `,

    profile: `
      <h1 class="page-title">👤 Meu perfil</h1>
      <div class="card">
        <div class="emoji">🐼</div>
        <h2 id="profileEmail"></h2>
        <p id="profileCoins"></p>
      </div>
    `
  };

  content.innerHTML = pages[page] || pages.home;

  // BIBLIOTECA
  if (page === "library") {
    if (typeof renderLibrary === "function") {
      renderLibrary();
    } else {
      showLibraryError();
    }
  }

  // EDITOR DE LIVROS
  if (page === "create") {
    if (typeof renderBookEditor === "function") {
      renderBookEditor();
    } else {
      showEditorError();
    }
  }

  // LOJA PANDA
if (page === "shop") {
  if (typeof renderShop === "function") {
    renderShop();
  } else {
    document.getElementById("content").innerHTML = `
      <h1 class="page-title">🛍️ Loja Panda</h1>
      <div class="empty">
        <div class="emoji">⚠️</div>
        <h2>Não foi possível carregar a loja.</h2>
        <p>Confira se o arquivo loja.js está na mesma pasta do index.html.</p>
      </div>
    `;
  }
}

  // PERFIL
  if (page === "profile") {
    document.getElementById("profileEmail")
      .textContent = currentUser.email;

    document.getElementById("profileCoins")
      .textContent = "🪙 Moedas: " + currentUser.coins;
  }
}

// =================================
// ERROS DE CARREGAMENTO
// =================================

function showEditorError() {
  document.getElementById("content").innerHTML = `
    <h1 class="page-title">✍️ Criar meu livro</h1>
    <div class="empty">
      <div class="emoji">⚠️</div>
      <h2>Não foi possível carregar o editor.</h2>
      <p>Confira se o arquivo biblioteca.js está na mesma pasta do index.html.</p>
      <button class="main-button"
        style="max-width:220px"
        onclick="location.reload()">
        Tentar novamente
      </button>
    </div>
  `;
}

function showLibraryError() {
  document.getElementById("content").innerHTML = `
    <h1 class="page-title">📚 Biblioteca Panda</h1>
    <div class="empty">
      <div class="emoji">⚠️</div>
      <h2>Não foi possível carregar a biblioteca.</h2>
      <p>Confira o arquivo biblioteca.js.</p>
    </div>
  `;
}

// =================================
// RESTAURAR SESSÃO
// =================================

const savedSession = sessionStorage.getItem(SESSION_KEY);

if (savedSession) {
  openApp(savedSession);
}

</script>

<!-- CARREGAR A BIBLIOTECA DEPOIS DO SCRIPT PRINCIPAL -->

<script
  src="./biblioteca.js"
  onerror="console.error('Erro: biblioteca.js não foi encontrado!')">
</script>

  <script
  src="./loja.js"
  onerror="console.error('Erro: loja.js não foi encontrado!')">
</script>

</body>
</html>
