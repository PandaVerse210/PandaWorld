''
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PandaWorld 🐼</title>

<style>
:root {
  --green: #527b59;
  --dark-green: #304c36;
  --light-green: #e4efdf;
  --cream: #faf8ef;
  --white: #ffffff;
  --text: #26372b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  background: var(--green);
  color: white;
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  margin-right: 8px;
}

#authArea {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(140deg,#e7f0df,#faf8ef);
}

.auth-card {
  width: 100%;
  max-width: 410px;
  background: white;
  padding: 35px;
  border-radius: 22px;
  box-shadow: 0 8px 30px #26372b18;
  text-align: center;
}

.panda {
  font-size: 78px;
  margin-bottom: 10px;
}

.auth-card h1 {
  color: var(--green);
  margin-bottom: 10px;
}

.auth-card p {
  color: #777;
  line-height: 1.5;
  margin-bottom: 20px;
}

.auth-card input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #d9dfd5;
  border-radius: 10px;
}

.main-button {
  width: 100%;
  background: var(--green);
  color: white;
  border: none;
  padding: 13px;
  border-radius: 10px;
  margin-top: 12px;
  font-weight: bold;
}

.main-button:hover {
  background: var(--dark-green);
}

.main-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.switch {
  color: var(--green);
  margin-top: 20px;
  cursor: pointer;
  font-size: 14px;
}

#authMessage {
  color: #b33b3b;
  font-size: 13px;
  margin-top: 12px;
}

#app {
  display: none;
}

nav {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: white;
  overflow-x: auto;
  border-bottom: 1px solid #e5e8df;
}

nav button {
  border: none;
  padding: 11px 15px;
  background: #f0f4ec;
  color: var(--text);
  border-radius: 10px;
  white-space: nowrap;
}

nav button.active {
  background: var(--green);
  color: white;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px;
  min-height: 70vh;
}

.welcome {
  background: var(--light-green);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 25px;
}

.welcome h1 {
  color: var(--dark-green);
  margin-bottom: 12px;
  font-size: 28px;
}

.welcome p {
  line-height: 1.7;
  color: #536655;
}

.welcome-emoji {
  font-size: 65px;
  margin-bottom: 10px;
}

.page-title {
  color: var(--green);
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
  gap: 16px;
  margin-top: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 3px 12px #26372b0c;
}

.card h3 {
  margin-bottom: 9px;
}

.card p {
  color: #777;
  font-size: 14px;
  line-height: 1.6;
}

.emoji {
  font-size: 35px;
  margin-bottom: 12px;
}

.empty {
  background: white;
  padding: 35px 20px;
  border-radius: 16px;
  text-align: center;
  color: #777;
  line-height: 1.7;
}

.logout {
  background: #ffffff25;
  color: white;
  border: 1px solid #ffffff66;
  padding: 9px 14px;
  border-radius: 9px;
}

footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  padding: 25px;
}

input, textarea, select {
  outline-color: var(--green);
}

@media(max-width:500px) {
  header {
    padding: 14px;
  }

  .logo {
    font-size: 20px;
  }

  .auth-card {
    padding: 25px 20px;
  }

  .welcome {
    padding: 22px;
  }

  .welcome h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<section id="authArea">
  <div class="auth-card">
    <div class="panda">🐼</div>

    <h1>PandaWorld</h1>

    <p id="authDescription">
      Entre no seu universo de leitura e criatividade!
    </p>

    <form id="authForm">
      <input
        id="email"
        type="email"
        placeholder="Seu e-mail"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Sua senha"
        minlength="8"
        autocomplete="current-password"
        required
      >

      <button class="main-button" id="authButton">
        Entrar
      </button>
    </form>

    <div class="switch" id="switchAuth">
      Ainda não tem conta? Criar conta
    </div>

    <div id="authMessage"></div>
  </div>
</section>

<div id="app">

  <header>
    <div class="logo">
      <span>🐼</span>PandaWorld
    </div>

    <button class="logout" id="logoutButton">
      Sair
    </button>
  </header>

  <nav id="navigation">
    <button class="active" data-page="home">🏠 Início</button>
    <button data-page="library">📚 Biblioteca</button>
    <button data-page="create">✍️ Criar livro</button>
    <button data-page="shop">🛍️ Loja</button>
    <button data-page="games">🎮 Jogos</button>
    <button data-page="ranking">🏆 Ranking</button>
    <button data-page="news">📰 Notícias</button>
    <button data-page="profile">👤 Perfil</button>
  </nav>

  <main id="content"></main>

  <footer>
    🐼 PandaWorld — Um mundo criado por estudantes.
  </footer>

</div> 
  
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>

<!-- Módulos -->
<script src="./biblioteca.js"></script>
<script src="./loja.js"></script>
<script src="./jogos.js"></script>

<!-- Sistema principal -->
<script src="./script.js"></script>

</body>
</html>
